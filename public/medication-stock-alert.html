<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyTherapy Prototype v2 - 库存提醒</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body data-page="today">
  <main class="prototype-shell">
    <section class="phone">
      <div class="screen">
        <div>
          <div class="status"><span>9:41</span><span>5G · 76%</span></div>
          <div class="appbar detail-appbar">
            <div>
              <a class="detail-back" id="stockBack" href="./medication-reminder-time.html">返回提醒时间</a>
              <h3>库存提醒</h3>
            </div>
          </div>
        </div>

        <div class="content detail-content">
          <article class="card detail-header-card">
            <div class="detail-status-row">
              <strong>开启提醒</strong>
              <label class="switch-chip">
                <input id="stockToggle" type="checkbox" checked />
                <span class="switch-dot"></span>
              </label>
            </div>
            <label class="once-form-row">
              <span class="detail-field-label">当前库存</span>
              <input id="stockCurrent" class="once-input" type="number" min="0" step="1" value="30" />
            </label>
            <label class="once-form-row">
              <span class="detail-field-label">提醒阈值</span>
              <input id="stockThreshold" class="once-input" type="number" min="0" step="1" value="10" />
            </label>
          </article>

          <article class="card detail-action-card">
            <a class="btn-primary" href="./medication-plan-result.html?plan=regular" id="stockSave">保存</a>
          </article>
        </div>

        <div class="bottom-nav">
          <div class="bottom-nav-inner">
            <a class="tab" data-nav-page="today" href="./today.html"><svg class="tab-ico"><use href="#i-calendar"></use></svg><span>今日</span></a>
            <a class="tab" data-nav-page="progress" href="./progress.html"><svg class="tab-ico"><use href="#i-chart"></use></svg><span>进展</span></a>
            <a class="tab" data-nav-page="ai" href="./ai.html"><svg class="tab-ico"><use href="#i-spark"></use></svg><span>AI</span></a>
            <a class="tab" data-nav-page="me" href="./my.html"><svg class="tab-ico"><use href="#i-user"></use></svg><span>我的</span></a>
          </div>
        </div>
      </div>
    </section>
  </main>
  <script src="./app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      const queryString = params.toString();
      const back = document.getElementById("stockBack");
      const save = document.getElementById("stockSave");
      if (back) {
        back.href = queryString
          ? `./medication-reminder-time.html?${queryString}`
          : "./medication-reminder-time.html";
      }
      if (save) {
        save.href = queryString
          ? `./medication-plan-result.html?plan=regular&${queryString}`
          : "./medication-plan-result.html?plan=regular";
      }
    });
  </script>
</body>
</html>
