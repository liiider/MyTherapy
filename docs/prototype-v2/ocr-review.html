<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyTherapy 原型 v2 - OCR 确认</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body data-page="ai">
  <main class="prototype-shell">
    <section class="phone">
      <div class="screen">
        <div>
          <div class="status"><span>9:41</span><span>5G · 76%</span></div>
          <div class="appbar"><div><h3>OCR 确认</h3><p>识别结果需人工确认</p></div></div>
        </div>
        <div class="content">
          <article class="card hero-card">
            <div class="group-inline">
              <span class="ico-badge"><svg class="ico"><use href="#i-camera"></use></svg></span>
              <div><h4>医嘱截图</h4><p class="subcopy">已生成规则草稿</p></div>
            </div>
          </article>
          <div class="task-row"><span class="ico-badge"><svg class="ico"><use href="#i-pill"></use></svg></span><div class="task-copy"><strong>补剂</strong><div class="task-meta"><span class="mini-chip">药名</span></div></div><span class="task-time">确认</span></div>
          <div class="task-row"><span class="ico-badge"><svg class="ico"><use href="#i-pill"></use></svg></span><div class="task-copy"><strong>1 药片</strong><div class="task-meta"><span class="mini-chip">剂量</span></div></div><span class="task-time">确认</span></div>
          <div class="task-row" style="border-color:rgba(193,100,77,.5); background:rgba(255,242,239,.96);"><span class="ico-badge"><svg class="ico"><use href="#i-clock"></use></svg></span><div class="task-copy"><strong>每天 1 次</strong><div class="task-meta"><span class="mini-chip">低置信度</span></div></div><span class="task-time">频次</span></div>
          <div class="task-row"><span class="ico-badge soft-green"><svg class="ico"><use href="#i-clock"></use></svg></span><div class="task-copy"><strong>08:30 · 饭后</strong><div class="task-meta"><span class="mini-chip">时间建议</span></div></div><span class="task-time">确认</span></div>
          <article class="card">
            <div class="section-title"><span>风险提示</span><span>1 项</span></div>
            <p class="subcopy">“每天 1 次” 这项可能来自模糊文字，建议你手动确认。需要的话可同步生成晚间副作用自查规则。</p>
          </article>
          <div class="button-row">
            <a class="btn-primary" href="./therapy-rules.html">保存</a>
            <a class="btn-secondary" href="./ai.html">编辑</a>
            <a class="btn-ghost" href="./ai.html">稍后</a>
          </div>
        </div>
        <div class="bottom-nav">
          <div class="bottom-nav-inner">
            <a class="tab" data-nav-page="today" href="./today.html"><svg class="tab-ico"><use href="#i-calendar"></use></svg><span>今日</span></a>
            <a class="tab" data-nav-page="progress" href="./progress.html"><svg class="tab-ico"><use href="#i-chart"></use></svg><span>进展</span></a>
            <a class="tab" data-nav-page="ai" href="./ai.html"><svg class="tab-ico"><use href="#i-spark"></use></svg><span>AI</span></a>
            <a class="tab" data-nav-page="me" href="./my.html"><svg class="tab-ico"><use href="#i-user"></use></svg><span>我的</span></a>
          </div>
        </div>
      </div>
    </section>
  </main>
  <script src="./app.js"></script>
</body>
</html>
