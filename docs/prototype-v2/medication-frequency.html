<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyTherapy Prototype v2 - 服用频率</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body data-page="today">
  <main class="prototype-shell">
    <section class="phone">
      <div class="screen">
        <div>
          <div class="status"><span>9:41</span><span>5G · 76%</span></div>
          <div class="appbar detail-appbar">
            <div>
              <a class="detail-back" id="frequencyBack" href="./today-medication-entry.html?mode=long">返回类型</a>
              <h3>服用频率</h3>
            </div>
          </div>
        </div>

        <div class="content detail-content">
          <article class="card detail-header-card">
            <div class="option-list">
              <button class="option-item is-selected" type="button" data-frequency="once">
                <div><strong>每天一次</strong></div>
                <span class="option-mark"></span>
              </button>
              <button class="option-item" type="button" data-frequency="twice">
                <div><strong>一天两次</strong></div>
                <span class="option-mark"></span>
              </button>
              <button class="option-item" type="button" data-frequency="more">
                <div><strong>更多设置</strong></div>
                <span class="option-mark"></span>
              </button>
            </div>
          </article>

          <article class="card detail-action-card">
            <a class="btn-primary" href="./medication-reminder-time.html?preset=once" id="frequencyNext">下一步</a>
          </article>
        </div>

        <div class="bottom-nav">
          <div class="bottom-nav-inner">
            <a class="tab" data-nav-page="today" href="./today.html"><svg class="tab-ico"><use href="#i-calendar"></use></svg><span>今日</span></a>
            <a class="tab" data-nav-page="progress" href="./progress.html"><svg class="tab-ico"><use href="#i-chart"></use></svg><span>进展</span></a>
            <a class="tab" data-nav-page="ai" href="./ai.html"><svg class="tab-ico"><use href="#i-spark"></use></svg><span>AI</span></a>
            <a class="tab" data-nav-page="me" href="./my.html"><svg class="tab-ico"><use href="#i-user"></use></svg><span>我的</span></a>
          </div>
        </div>
      </div>
    </section>
  </main>
  <script src="./app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      const baseQuery = new URLSearchParams(params);
      baseQuery.delete("preset");
      baseQuery.delete("plan");
      const queryString = baseQuery.toString();

      const items = document.querySelectorAll("[data-frequency]");
      const next = document.getElementById("frequencyNext");
      const back = document.getElementById("frequencyBack");
      let selectedFrequency = "once";

      if (back) {
        back.href = queryString
          ? `./today-medication-entry.html?mode=long&${queryString}`
          : "./today-medication-entry.html?mode=long";
      }

      const withQuery = (url) => (queryString ? `${url}&${queryString}` : url);

      const syncNext = () => {
        if (!next) return;
        if (selectedFrequency === "more") {
          next.href = queryString
            ? `./medication-frequency-advanced.html?${queryString}`
            : "./medication-frequency-advanced.html";
          return;
        }
        next.href = withQuery(`./medication-reminder-time.html?preset=${encodeURIComponent(selectedFrequency)}`);
      };

      items.forEach((item) => {
        item.addEventListener("click", () => {
          selectedFrequency = item.dataset.frequency || "once";
          items.forEach((current) => current.classList.toggle("is-selected", current === item));
          syncNext();
        });
      });

      syncNext();
    });
  </script>
</body>
</html>
