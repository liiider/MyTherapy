<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyTherapy 原型 v2 - 任务详情</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body data-page="today">
  <main class="prototype-shell">
    <section class="phone">
      <div class="screen">
        <div class="statusbar"><span>9:41</span><span>5G 76%</span></div>
        <header class="appbar">
          <div class="page-actions">
            <a class="back-link nav-link" data-icon="home" href="./today.html">返回今日</a>
            <a class="top-chip chip-link" data-icon="pill" href="./therapy-rules.html">查看规则</a>
          </div>
          <h1>任务详情</h1>
          <p>统一承接完成、延后、跳过和补记。</p>
        </header>
        <div class="content">
          <article class="card hero-card">
            <div class="section-head">
              <span class="eyebrow" data-icon="pill">药物任务</span>
              <span class="state tag-brand">待完成</span>
            </div>
            <div class="title-row">
              <span class="icon-badge"><svg class="icon"><use href="#i-pill"></use></svg></span>
              <div class="title-stack">
                <h2>补剂</h2>
                <p class="muted">08:30 · 饭后 1 片 · 来源 OCR 规则</p>
              </div>
            </div>
            <div class="grid-2">
              <div class="metric">
                <span class="muted">rule_id</span>
                <strong>R-1024</strong>
              </div>
              <div class="metric">
                <span class="muted">task_id</span>
                <strong>T-3001</strong>
              </div>
            </div>
          </article>

          <article class="card">
            <div class="section-head">
              <span class="eyebrow" data-icon="check">执行动作</span>
              <span class="pill">统一动作</span>
            </div>
            <div class="grid-2">
              <button class="btn" data-icon="check" data-result="done-result">已完成</button>
              <button class="btn-secondary" data-icon="clock" data-result="delay-result">延后 30 分钟</button>
              <button class="btn-ghost" data-icon="alert" data-result="skip-result">跳过本次</button>
              <button class="btn-ghost" data-icon="edit" data-result="backfill-result">补记</button>
            </div>
            <div class="result-banner" id="done-result" hidden>写入已完成 Record，并更新 Task 状态。</div>
            <div class="result-banner warn" id="delay-result" hidden>保留当前 Task，并重新计算提醒时间。</div>
            <div class="result-banner warn" id="skip-result" hidden>跳过也会生成记录，用于进展统计。</div>
            <div class="result-banner" id="backfill-result" hidden>补充实际完成时间和备注后写入 Record。</div>
          </article>

          <article class="card">
            <div class="section-head">
              <span class="eyebrow" data-icon="edit">补记表单</span>
              <span class="tag tag-warn">静态示意</span>
            </div>
            <div class="field-list">
              <div class="field">
                <label>计划时间</label>
                <div class="value">2026-03-30 08:30</div>
              </div>
              <div class="field">
                <label>实际完成时间</label>
                <div class="value">2026-03-30 09:12</div>
              </div>
              <div class="field">
                <label>备注</label>
                <div class="value">早餐延后，实际晚了 42 分钟。</div>
              </div>
            </div>
            <div class="button-row">
              <a class="btn nav-link" data-icon="trend" href="./progress-export.html">写入记录后查看进展</a>
            </div>
          </article>
        </div>
        <footer class="bottom-nav">
          <div class="bottom-nav-inner">
            <a class="tab tab-link" data-page-link="today" href="./today.html">今日</a>
            <a class="tab tab-link" data-page-link="progress" href="./progress-export.html">进展</a>
            <a class="tab tab-link" data-page-link="ai" href="./ai-suggestions.html">AI</a>
            <a class="tab tab-link" data-page-link="me" href="./my.html">我的</a>
          </div>
        </footer>
      </div>
    </section>
  </main>
  <script src="./app.js"></script>
</body>
</html>
